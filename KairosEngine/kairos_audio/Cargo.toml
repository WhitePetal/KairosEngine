[package]
name = "kairos_audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Kairos engine's audio subsystem — a kira-backed `AudioEngine` World resource plus the `AudioAsset`/`PcmData`/`AudioExt` assets and the spatial/background components — extracted as a standalone crate"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
async-fs = "2.1"
anyhow = "1.0"
kira = { version = "0.12.0", features = ["serde"] }
mint = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
smallvec = { version = "1.15.2", features = ["union", "serde", "const_new", "write"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "isomp4"] }
toml = "1.1.2"
kairos_asset = { path = "../kairos_asset" }
kairos_ecs = { path = "../kairos_ecs" }
kairos_math = { path = "../kairos_math" }
kairos_tasks = { path = "../kairos_tasks" }
kairos_time = { path = "../kairos_time" }
kairos_transform = { path = "../kairos_transform" }

[dev-dependencies]
tempfile = "3"
