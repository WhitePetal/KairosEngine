[package]
name = "kairos_tasks"
version = "0.1.0"
edition = "2024"
description = "Async task pool, task handles, and parallel iteration primitives for KairosEngine"
license = "MIT OR Apache-2.0"

# Foundation crate — keep the dependency list minimal on purpose.
# `kairos_tasks` must never depend on `kairos_engine`.
[dependencies]
async-channel = "2.5.0"
async-executor = "1.14.0"
async-io = "2.6.0"
async-task = "4.7.1"
concurrent-queue = "2.5.0"
derive_more = { version = "2.1.1", default-features = false, features = [
  "deref",
  "deref_mut"
] }
futures-lite = "2.6.1"
