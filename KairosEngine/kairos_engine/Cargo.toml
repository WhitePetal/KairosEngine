[package]
name = "kairos_engine"
version = "0.1.0"
edition = "2024"
default-run = "kairos_engine"
description = "A Game Engine"
license = "MIT OR Apache-2.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
smallvec = { version = "1.15.2", features = ["malloc_size_of"] }
tempfile = "3"

[features]
test-harness = ["dep:tokio-tungstenite", "dep:futures-util", "dep:serde_json"]

[dependencies]

toml = "1.1.2"
anyhow = { version = "1.0" }
rand = "0.10.1"
smallvec = { version = "1.15.2", features = ["union", "serde", "const_new", "write"] }
crossbeam-channel = "0.5.15"
bytemuck = { version = "1.25.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
rayon = "1.12.0"
rkyv = "0.8.16"
petgraph = "0.8.3"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
open = "5.4.0"
native-dialog = "0.9.6"
serde = "1.0.228"
sonic-rs = "0.5.7"
strum = { version = "0.26", features = ["derive"] }
duplicate = "2.0"
paste = "1.0"
image = { version = "0.25.10", features = ["rayon", "serde", "png"] }
base64 = "0.22.1"
wgpu = { version = "29.0.3", features = ["serde"] }
pollster = "0.3"
# eframe = { version = "0.34.2", features = ["wgpu"] }
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["all_loaders", "datepicker", "syntect"] }
emath = "0.35.0"
epaint = "0.35.0"
# egui_dock = "0.18.0"
egui-winit = "0.35.0"
egui-wgpu = "0.35.0"
parking_lot = "0.12.5"
gltf = "1.4.1"
foldhash = "0.2.0"
uuid = { version = "1", features = ["v4", "serde"] }
kira = { version = "0.12.0", features = ["serde"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "isomp4"] }
rustfft = "6"
half = { version = "2.4", features = ["bytemuck"] }
mint = "0.5"
rapier3d = { version = "0.33.0", features = [ "simd-stable", "parallel", "serde-serialize"] }
glam = { version = "0.33", features = ["bytemuck"] }
egui_commonmark = "0.24.0"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
# puffin = "0.20.0"
tokio-tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true }
serde_json = { version = "1.0", optional = true }
nonmax = "0.5.5"
derive_more = "2.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[[bench]]
name = "vec_benchmark"
harness = false

[[bench]]
name = "texture_encode_decode"
harness = false
