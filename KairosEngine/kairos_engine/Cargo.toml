[package]
name = "kairos_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A Game Engine"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[features]
default = ["debug", "trace"]
track_location = ["kairos_ecs/track_location"]
debug = ["kairos_ecs/debug"]
trace = ["kairos_ecs/trace", "kairos_transform/trace"]
kairos_reflect = ["kairos_ecs/kairos_reflect"]
hotpatching = ["kairos_ecs/hotpatching"]
debug_stepping = ["kairos_ecs/debug_stepping"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
rkyv = "0.8.16"
rand = "0.10.1"
smallvec = { version = "1.15.2", features = ["union", "serde", "const_new", "write"] }
winit = { version = "0.30", features = ["android-native-activity"] }
log = "0.4"
serde = "1.0.228"
# `EngineSettings::load` reads the project's toml settings file.
toml = "1.1.2"
pollster = "0.3"
# The frame loop in `runtime` matches on surface acquisition errors
# (`CurrentSurfaceTexture`) directly; everything else goes through
# `kairos_graphics`.
wgpu = "29.0.3"
half = { version = "2.4", features = ["bytemuck"] }
kairos_ecs = { path = "../kairos_ecs" }
kairos_asset = { path = "../kairos_asset" }
# `Color` lives in `kairos_color` and is re-exported from here, so
# `kairos_engine::math::Color` stays the path engine/editor code uses.
kairos_color = { path = "../kairos_color" }
kairos_audio = { path = "../kairos_audio" }
kairos_graphics = { path = "../kairos_graphics" }
kairos_math = { path = "../kairos_math", features = ["rkyv"] }
kairos_physics = { path = "../kairos_physics" }
# Runtime profiling is part of the game frame, not an editor feature: the engine
# owns the recorder and opens the frame in `Engine::update`.
kairos_profile = { path = "../kairos_profile" }
kairos_tasks = { path = "../kairos_tasks" }
kairos_time = { path = "../kairos_time" }
kairos_transform = { path = "../kairos_transform" }

[[bench]]
name = "texture_encode_decode"
harness = false
