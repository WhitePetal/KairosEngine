[package]
name = "kairos_engine"
version = "0.1.0"
edition = "2024"
description = "A Game Engine"
license = "MIT OR Apache-2.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[features]
default = ["debug", "trace"]
track_location = ["kairos_ecs/track_location"]
debug = ["kairos_ecs/debug"]
trace = ["kairos_ecs/trace", "kairos_transform/trace"]
kairos_reflect = ["kairos_ecs/kairos_reflect"]
hotpatching = ["kairos_ecs/hotpatching"]
debug_stepping = ["kairos_ecs/debug_stepping"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
rkyv = "0.8.16"
rand = "0.10.1"
smallvec = { version = "1.15.2", features = ["union", "serde", "const_new", "write"] }
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
serde = "1.0.228"
# `math/color/converts.rs` converts the engine's colors to egui/syntect colors,
# so the engine keeps these two UI-ecosystem crates even without the editor.
egui = "0.35.0"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
pollster = "0.3"
half = { version = "2.4", features = ["bytemuck"] }
kairos_ecs = { path = "../kairos_ecs" }
kairos_asset = { path = "../kairos_asset" }
kairos_audio = { path = "../kairos_audio" }
kairos_graphics = { path = "../kairos_graphics" }
kairos_math = { path = "../kairos_math", features = ["rkyv"] }
kairos_physics = { path = "../kairos_physics" }
kairos_tasks = { path = "../kairos_tasks" }
kairos_time = { path = "../kairos_time" }
kairos_transform = { path = "../kairos_transform" }

[[bench]]
name = "texture_encode_decode"
harness = false
