[package]
name = "kairos_collections"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hashing utilities and deterministic (hashbrown/indexmap-backed) collections shared by kairos_ecs and kairos_engine"

# Foundation crate — keep the dependency list minimal on purpose.
# `kairos_collections` must never depend on `kairos_engine`.
[dependencies]
foldhash = "0.2.0"
hashbrown = { version = "0.17.1", features = ["serde"] }
indexmap = { version = "2.5.0", default-features = false, features = ["serde"] }
rayon = "1.12.0"
serde = "1"
