[package]
name = "kairos_editor_component"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "kairos editor's panel components"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
egui = "0.35.0"
# Component styles derive Serialize/Deserialize (RON files under Preferences).
serde = { version = "1.0.228", features = ["derive"] }

# Style colors are the shared `kairos_color::Color32`; `color.rs` converts them
# to egui colors when painting (the shared color crate stays UI-agnostic).
kairos_color = { path = "../kairos_color" }
kairos_editor_core = { path = "../kairos_editor_core" }
# Console lines are structured `kairos_log` records; the buffer lives next to the
# Console panel (see src/console.rs).
kairos_log = { path = "../kairos_log" }
# Profiling capture model: the Profiler panel is a view over host-owned frames
# (`HostView::profiler`); the data types live in the runtime crate, not here.
kairos_profile = { path = "../kairos_profile" }
kairos_editor_docking = { path = "../kairos_editor_docking" }
kairos_editor_widgets = { path = "../kairos_editor_widgets" }