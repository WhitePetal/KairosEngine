[package]
name = "kairos_math"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spatial/geometry math for the Kairos engine (vec/quaternion/matrix wrappers over glam, plus AABB and affine), extracted as a standalone crate"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[features]
default = []
serde = ["dep:serde"]
rkyv = ["dep:rkyv"]

[dependencies]
bytemuck = "1.25"
glam = { version = "0.33", features = ["bytemuck"] }
serde = { version = "1", optional = true }
rkyv = { version = "0.8.16", optional = true }

[dev-dependencies]
criterion = "0.8"
serde_json = "1"

[[bench]]
name = "vec_benchmark"
harness = false
