[package]
name = "kairos_color"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared linear Color (f16 x4), sRGB encoding helpers, and color usage metadata"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
half = { version = "2.4", features = ["bytemuck"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
ron = "0.12"
# Test-only: the hex/serde round-trip tests derive Serialize/Deserialize.
serde = { version = "1.0.228", features = ["derive"] }
