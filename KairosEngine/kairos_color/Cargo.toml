[package]
name = "kairos_color"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared RGBA color type for the Kairos engine and editor: hex parsing/formatting and serde"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
serde = "1.0.228"
thiserror = "2.0"

[dev-dependencies]
ron = "0.12"
# Test-only: the hex/serde round-trip tests derive Serialize/Deserialize.
serde = { version = "1.0.228", features = ["derive"] }
