[package]
name = "kairos_editor_app"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "kairos editor's app"
default-run = "kairos_editor_app"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
egui = "0.35.0"
eframe = { version = "=0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
# Runtime image loading for editor UI assets (icons are files under
# `Preferences/Textures`, loaded at panel init; no `include_bytes!`).
egui_extras = { version = "0.35.0", default-features = false, features = ["file", "image"] }

kairos_editor_widgets = { path = "../kairos_editor_widgets" }
kairos_editor_docking = { path = "../kairos_editor_docking" }
kairos_editor_component = { path = "../kairos_editor_component" }
kairos_log = { path = "../kairos_log" }
# The `Profiler` type in the `HostView` seam; the engine owns the recorder.
kairos_profile = { path = "../kairos_profile" }
# The shell hosts the engine: it ticks the runtime and borrows its profiling
# recorder instead of creating a second one.
kairos_engine = { path = "../kairos_engine" }
kairos_editor_core = { path = "../kairos_editor_core" }
image = "0.25.10"
