[package]
name = "kairos_editor_app"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "kairos editor's app"
default-run = "kairos_editor_app"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
egui = "0.35.0"
# The app's own egui pass on the engine's loop (src/host.rs): raw input,
# tessellation and the egui render-graph node. The engine owns the loop.
egui-winit = "0.35.0"
egui-wgpu = "0.35.0"
egui_extras = { version = "0.35.0", default-features = false, features = ["file", "image"] }
epaint = "0.35.0"
# The window type the runtime config needs (size, min size, icon).
winit = { version = "0.30", features = ["android-native-activity"] }

kairos_editor_widgets = { path = "../kairos_editor_widgets" }
kairos_editor_docking = { path = "../kairos_editor_docking" }
kairos_editor_component = { path = "../kairos_editor_component" }
kairos_log = { path = "../kairos_log" }
# The `Profiler` type in the `HostView` seam; the engine owns the recorder.
kairos_profile = { path = "../kairos_profile" }
# The shell hosts an engine: the loop owns it and hands it to each pass, so the
# Profiler panel borrows the engine's recorder instead of creating a second one.
kairos_engine = { path = "../kairos_engine" }
kairos_editor_core = { path = "../kairos_editor_core" }
image = "0.25.10"
# The project tree's watcher (src/project/watcher.rs): the same backend and
# debounce window as the asset source's watcher (ADR 0006 deviations 7/8). The
# crate is already in the workspace lockfile through `kairos_editor`.
notify-debouncer-full = { version = "0.7.0", default-features = false }
# Opening a project file with its OS default program (src/project/mod.rs):
# `that_detached` asks ShellExecute/xdg-open/open(1) and returns at once, so a
# slow editor cannot stall the host phase. Pinned to the version the legacy
# editor already resolved, so this adds nothing new to the lockfile.
open = "5.4.4"
# The Project panel's delete (src/project/fs.rs): the OS recycle bin, never a
# permanent removal (D5). Default features keep the Windows COM apartment
# initialised per call, which is why a delete runs on its own worker thread
# (src/project/mod.rs) instead of the host's.
trash = "5.4.0"

[dev-dependencies]
# Project-slice tests build real directory trees (src/project/scanner.rs,
# src/project/watcher.rs) instead of mocking `std::fs`.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# The eyedropper's screen sampler (src/eyedropper/win32.rs): the OS pointer,
# a 15x15 BitBlt of the desktop, and the GDI loupe overlay. The widget layer
# stays pure egui; only this host crate touches the platform.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS shows the *application* icon in the Dock, and winit's window icon is a
# no-op there, so the app sets it through AppKit itself (src/branding.rs).
objc2 = "0.6.4"
# `NSResponder` is not used by name: it is `NSApplication`'s superclass, and
# objc2-app-kit only exports the subclass when both features are on. The legacy
# host compiles today only because native-dialog happens to enable it.
#
# The eyedropper (src/eyedropper/macos.rs) draws its own loupe with AppKit
# and reads pixels through ScreenCaptureKit. The system colour sampler is the
# fallback when Screen Recording permission is missing. `block2` carries both
# the sampler's selection handler and the asynchronous capture callbacks.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSEvent",
    "NSScreen",
    "NSCursor",
    "NSImage",
    "NSColor",
    "NSColorSampler",
    "NSColorSpace",
    "NSFont",
    "NSFontDescriptor",
    "NSBezierPath",
    "NSGraphics",
    "NSGraphicsContext",
    "NSTrackingArea",
    "NSAttributedString",
    "NSStringDrawing",
    "block2",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSAttributedString",
    "NSError",
] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGImage",
    "CGContext",
    "CGBitmapContext",
    "CGColorSpace",
    "CGDirectDisplay",
    "CGWindow",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "SCShareableContent",
    "SCScreenshotManager",
    "SCStream",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
block2 = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The eyedropper's X11 sampler (src/eyedropper/linux.rs): QueryPointer and
# GetImage on a private connection, plus the loupe's override-redirect window.
# x11rb's RustConnection speaks the protocol directly, so this adds no system
# library beyond what winit already needs; Wayland is reported unavailable by
# the same backend.
x11rb = { version = "0.13.2", features = ["image"] }
