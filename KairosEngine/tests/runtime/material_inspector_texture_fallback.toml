# MaterialInspector texture fallback (issue #34)
#
# Assigning a texture path that does not exist on disk must degrade to the
# white.texture fallback: the runtime Material keeps a resolvable texture
# handle (2x2 white) so preview/scene rendering is not skipped, a fallback
# warning is logged, and nothing crashes.

[[step]]
action = "call"
target = "ui.open_inspector"

[[step]]
action = "call"
target = "project.select_asset"
args = { path = "res/materials/material.mat" }

[[step]]
action = "call"
target = "system.wait_frames"
args = { count = 60 }

[[step]]
action = "assert"
target = "no_crash"

# The fallback resource itself must exist (engine preloads it at startup)
[[step]]
action = "assert"
target = "resource_exists"
args = { path = "res/textures/white.texture" }

# Assign a texture path that does not exist on disk
[[step]]
action = "call"
target = "material_inspector.assign_texture"
args = { texture = "res/textures/__missing_texture__.texture" }

[[step]]
action = "call"
target = "system.wait_frames"
args = { count = 30 }

# The degradation must be logged as a warning
[[step]]
action = "assert"
target = "log_contains"
args = { pattern = "falling back" }

# The runtime Material's texture handle must resolve to the 2x2 white texture
[[step]]
action = "assert"
target = "material_inspector.texture_loaded"
args = { width = 2, height = 2 }

[[step]]
action = "assert"
target = "no_crash"

[[step]]
action = "assert"
target = "wgpu_valid"
