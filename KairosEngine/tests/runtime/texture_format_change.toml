# Case 1: Texture Inspector — Format Change Validation
#
# Fully automated: opens inspector, selects texture, sets format, applies, verifies.
# Run in windowed mode: cargo run -p kairos_engine --features test-harness -- --test-file ...

# --- Setup: Ensure inspector is open ---
[[step]]
action = "call"
target = "ui.open_inspector"

# --- Setup: Select a texture asset in the project ---
[[step]]
action = "call"
target = "project.select_asset"
args = { path = "res/textures/test.texture" }

[[step]]
action = "assert"
target = "no_crash"

# --- Set format to a different value ---
[[step]]
action = "call"
target = "texture_inspector.set_format"
args = { format = "R8Unorm" }

[[step]]
action = "assert"
target = "no_crash"

# --- Apply the change ---
[[step]]
action = "call"
target = "texture_inspector.apply"

[[step]]
action = "assert"
target = "no_crash"

# --- Verify the .texture file was actually updated ---
[[step]]
action = "assert"
target = "toml_value_equals"
args = { file = "res/textures/test.texture", key = "format", value = "R8Unorm" }
