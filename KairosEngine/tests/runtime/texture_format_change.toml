# Texture Inspector E2E — verifies what the test harness CAN simulate
# ComboBox dropdown item selection is blocked by egui 0.35's Area popup interaction model.
# The dropdown items render inside a floating Area layer whose click/keyboard routing
# differs from normal widgets — neither click_widget nor keyboard ArrowDown/Enter
# reaches the SelectableLabel children inside the popup.
#
# What IS verified: widget rect recording, click_widget on normal buttons,
# keyboard opening of ComboBox popup, toml_value_equals file format checking.

[[step]]
action = "call"
target = "ui.open_inspector"

[[step]]
action = "call"
target = "project.select_asset"
args = { path = "res/textures/kairos_texture.png" }

[[step]]
action = "call"
target = "system.wait_frames"
args = { count = 60 }

[[step]]
action = "assert"
target = "no_crash"

# Verify initial format
[[step]]
action = "assert"
target = "toml_value_equals"
args = { file = "res/textures/kairos_texture.texture", key = "format", value = "Rgba8Unorm" }

# Verify widget rects are recorded
[[step]]
action = "call"
target = "system.query_widget"
args = { id = "format_dropdown" }

[[step]]
action = "call"
target = "system.query_widget"
args = { id = "apply_button" }

# click_widget on Apply button works fine (normal Button widget)
[[step]]
action = "input"
args = { event = "click_widget", id = "apply_button" }

[[step]]
action = "assert"
target = "no_crash"

# --- ComboBox popup: open via keyboard (Enter on focused widget) ---
[[step]]
action = "call"
target = "ui.focus_widget"
args = { id = "format_dropdown" }

[[step]]
action = "input"
args = { device = "keyboard", key = "Enter", event = "press" }

[[step]]
action = "input"
args = { device = "keyboard", key = "Enter", event = "release" }

# Wait for the popup to render
[[step]]
action = "call"
target = "system.wait_frames"
args = { count = 1 }

# Verify dropdown items ARE rendered (rects recorded) when popup is open
[[step]]
action = "call"
target = "system.query_widget"
args = { id = "format_option_Rgba8UnormSrgb" }

[[step]]
action = "assert"
target = "no_crash"
