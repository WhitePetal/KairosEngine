# Case 1: Texture Inspector — Format Change Validation
# Run in windowed mode: cargo run -p kairos_engine --features test-harness
# Then trigger via WS: ws_send.ps1 -TestFile tests/runtime/texture_format_change.toml

[[step]]
action = "call"
target = "ui.open_inspector"

[[step]]
action = "call"
target = "project.select_asset"
args = { path = "res/textures/kairos_texture.png" }

[[step]]
action = "assert"
target = "no_crash"

[[step]]
action = "call"
target = "texture_inspector.set_format"
args = { format = "R8Unorm" }

[[step]]
action = "assert"
target = "no_crash"

[[step]]
action = "call"
target = "texture_inspector.apply"

[[step]]
action = "assert"
target = "no_crash"

[[step]]
action = "assert"
target = "toml_value_equals"
args = { file = "res/textures/kairos_texture.texture", key = "format", value = "R8Unorm" }
