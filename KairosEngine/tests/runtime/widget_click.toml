# Case 2: Widget Interaction — Click and Side-Effect Detection
#
# Verifies harness can detect whether a widget responds to clicks.
# Run in windowed mode: cargo run -p kairos_engine --features test-harness -- --test-file ...

# --- Setup: Open inspector and select texture ---
[[step]]
action = "call"
target = "ui.open_inspector"

[[step]]
action = "call"
target = "project.select_asset"
args = { path = "res/textures/kairos_texture.png" }

# --- Query the egui viewport to know the window dimensions ---
[[step]]
action = "call"
target = "system.query_widget"
args = { id = "egui_viewport" }

[[step]]
action = "assert"
target = "no_crash"

# --- Click near the bottom-center of the viewport (where Apply button is) ---
[[step]]
action = "input"
args = { device = "mouse", event = "move", x = 960.0, y = 1000.0 }

[[step]]
action = "input"
args = { device = "mouse", event = "click", button = "Left" }

# --- Verify the click produced a side-effect ---
[[step]]
action = "assert"
target = "no_crash"
