# Case 2: Widget Interaction — Click and Side-Effect Detection
#
# Verifies the harness can detect whether a widget responds to clicks.
# Queries the widget position, computes click coordinates, clicks,
# and asserts a side-effect occurred.
#
# Preconditions:
#   - Engine running in windowed mode (NOT --headless)
#   - InspectorWindow is open with a .texture asset selected
#   - The Apply button is visible
#
# Strategy:
#   - Query the egui viewport rect to know the window dimensions
#   - Click near the bottom-center of the viewport (where Apply button is)
#   - Assert a side-effect occurred
#
# To verify harness effectiveness:
#   1. Normal inspector → click on Apply works → side-effect occurs → test PASSES
#   2. Duplicate widget ID → Apply button non-interactive → side-effect absent → test FAILS

# Query the egui viewport to know where to click
[[step]]
action = "call"
target = "system.query_widget"
args = { id = "egui_viewport" }

[[step]]
action = "assert"
target = "no_crash"

# Click near the bottom of the viewport (where Apply button typically is).
# Coordinates computed as: center-x at bottom-50px.
# This is a heuristic; adjust based on actual inspector layout.
[[step]]
action = "input"
args = { device = "mouse", event = "move", x = 960.0, y = 1000.0 }

[[step]]
action = "input"
args = { device = "mouse", event = "click", button = "Left" }

[[step]]
action = "assert"
target = "no_crash"

# Verify the click produced a side-effect.
# When the Apply button works, it sends a TextureInspectorApply message
# which triggers save_texture. Look for log output from the save.
[[step]]
action = "assert"
target = "log_contains"
args = { pattern = "texture" }
