[package]
name = "kairos_editor_widgets"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "kairos editor's widgets"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
egui = "0.35.0"
# Component styles and the font list are RON files under `Preferences/Styles`.
ron = "0.12"
serde = { version = "1.0.228", features = ["derive"] }