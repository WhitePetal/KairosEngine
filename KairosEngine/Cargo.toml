cargo-features = ["profile-rustflags"]

[profile.release]
rustflags = ["-C", "target-cpu=native"]

[profile.bench]
rustflags = ["-C", "target-cpu=native"]

[package]
name = "kairos_engine"
version = "0.1.0"
edition = "2024"
description = "A Game Engine"
license = "MIT OR Apache-2.0"

[dev-dependencies]
criterion = "0.8.2"

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
native-dialog = "0.9.6"
serde = "1.0.228"
sonic-rs = "0.5.7"
duplicate = "2.0"
paste = "1.0"
image = { version = "0.25.10", features = ["png"] }
wgpu = "27.0"
pollster = "0.3"
eframe = { version = "0.33.3", features = ["wgpu"] }
egui = "0.33.3"
egui_extras = { version = "0.33.3", features = ["all_loaders"] }
# egui_dock = "0.18.0"

[[bench]]
name = "vec_benchmark"
harness = false