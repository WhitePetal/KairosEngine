[package]
name = "kairos_transform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A bevy_transform-style LocalTransform/GlobalTransform ECS component pair for the Kairos engine (kairos_math-backed), extracted as a standalone crate"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[features]
default = []

[dependencies]
derive_more = "2.1.1"
kairos_ecs = { path = "../kairos_ecs" }
kairos_math = { path = "../kairos_math" }
serde = "1.0.228"
