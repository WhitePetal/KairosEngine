[package]
name = "kairos_asset"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Async asset server and handle system for the Kairos engine, extracted as a standalone crate"

[features]
default = []
# Enables the runtime asset processor track. Off by default; the processor body
# itself lands in a later slice, so `AssetMode::Processed` with this on is not yet
# supported by `install`.
use_asset_processor = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
async-broadcast = "0.7.2"
async-channel = "2.5.0"
async-fs = "2.1"
async-lock = "3.4.2"
atomicow = { version = "1.1", default-features = false, features = ["std"] }
blake3 = "1.8"
crossbeam-channel = "0.5.15"
futures-io = "0.3"
futures-lite = "2.6.1"
futures-util = "0.3"
kairos_collections = { path = "../kairos_collections" }
kairos_ecs = { path = "../kairos_ecs" }
kairos_tasks = { path = "../kairos_tasks" }
ron = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.19"
uuid = { version = "1", features = ["v4", "serde"] }
