[package]
name = "kairos_asset"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Async asset server and handle system for the Kairos engine, extracted as a standalone crate"

[features]
# The file watcher (hot reload) is on by default: without a backend there is no
# way to observe source changes at runtime.
default = ["file_watcher"]
# Enables the `watching_for_changes` switch without forcing a watcher backend.
# A host can run with watching on and no configured watcher; a source that has
# no watcher only warns.
watch = []
# The filesystem watcher backend (`notify-debouncer-full`). Implies `watch`.
file_watcher = ["dep:notify-debouncer-full", "watch"]
# The embedded-asset watcher backend. Implies `file_watcher`; the embedded
# backend itself is a separate slice.
embedded_watcher = ["file_watcher"]
# Enables the runtime asset processor track by default: with
# `AssetMode::Processed` a host can select layout ② (a processor producing the
# outputs) over layout ③ (outputs shipped ahead of time). Off by default.
#
# Named `asset_processor` for parity with `bevy_asset`.
asset_processor = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)", "cfg(docsrs_dep)"] }

[dependencies]
async-broadcast = "0.7.2"
async-channel = "2.5.0"
async-fs = "2.1"
async-lock = "3.4.2"
atomicow = { version = "1.1", default-features = false, features = ["std"] }
blake3 = "1.8"
crossbeam-channel = "0.5.15"
futures-io = "0.3"
futures-lite = "2.6.1"
futures-util = "0.3"
hashbrown = "0.17.1"
kairos_collections = { path = "../kairos_collections" }
kairos_ecs = { path = "../kairos_ecs" }
kairos_tasks = { path = "../kairos_tasks" }
# The file-watcher backend, only compiled with the `file_watcher` feature.
notify-debouncer-full = { version = "0.7.0", default-features = false, optional = true }
ron = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.19"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# The `FromTemplate` derive, used to test how `Handle<A>` fields resolve to
# `HandleTemplate<A>` in a template.
kairos_ecs_macros = { path = "../kairos_ecs/macros" }
